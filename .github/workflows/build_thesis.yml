name: "Build Thesis LaTeX"
on:
  push:
    paths:
      - "thesis/**"
      - ".github/workflows/build_thesis.yml"
jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache Tectonic
        uses: actions/cache@v3
        with:
          path: ~/.cache/Tectonic
          key: ${{ runner.os }}-tectonic-${{ hashFiles('**/*.tex') }}
          restore-keys: |
            ${{ runner.os }}-tectonic-
      - name: Setup Tectonic
        uses: wtfjoke/setup-tectonic@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          biber-version: "2.17"
      - name: Build
        run: tectonic -X compile thesis/src/thesis.tex
      - name: Rename PDF
        run:
          "mv thesis/src/thesis.pdf
          thesis/src/thesis_expressing_crdts_with_datalog_leo_stewen.pdf"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: "Thesis Expressing CRDTs with Datalog - Leo Stewen"
          path: thesis/src/thesis_expressing_crdts_with_datalog_leo_stewen.pdf
          if-no-files-found: error
          overwrite: true
      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: |
            thesis/src/thesis_expressing_crdts_with_datalog_leo_stewen.pdf
            LICENSE
